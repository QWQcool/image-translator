name: E2E

on:
  push:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # --with-deps 装 Chromium 的系统依赖库（ubuntu runner 缺省没有）
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # 生产构建由 playwright.config.ts 的 webServer 自带（TRIAL_MODE=1 + 独立
      # NEXT_DIST_DIR/DATA_DIR），无需在此单独 build
      - name: 运行 E2E 冒烟
        run: npx playwright test

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
